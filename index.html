<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jubilee</title>
  <style>
    body {
      margin: 0;
    }

    .hero {
      position: relative;
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      place-items: center;
      isolation: isolate;
      background: #252525;
    }

    .hero img,
    .hero::before {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .hero img {
      z-index: -2;
      object-fit: contain;
    }

    .hero::before {
      z-index: -1;
      content: "";
      background: linear-gradient(transparent, rgb(0 0 0 / 50%), transparent);
    }

    h1 {
      max-width: 15ch;
      margin: 0;
      padding: 1.5rem;
      color: white;
      font: italic 400 clamp(2.75rem, 8vw, 7.5rem) / 1.05 Georgia, serif;
      text-align: center;
      text-wrap: balance;
      text-shadow: 0 2px 16px rgb(0 0 0 / 55%);
    }
  </style>
</head>
<body>
  <main class="hero">
    <img src="assets/leo1.jpg" alt="" width="2448" height="3264">
    <header>
      <h1>coming soon to anholt, jubilee!</h1>
    </header>
  </main>
</body>
</html>
